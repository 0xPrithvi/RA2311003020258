<!DOCTYPE html>
<html>
<head>
    <title>BFHL Project</title>
</head>
<body>

    <h1>SRM Full Stack Challenge</h1>

    <textarea id="input" rows="10" cols="50"
    placeholder="Enter data like A->B,A->C"></textarea>

    <br><br>

    <button onclick="submitData()">Submit</button>

    <pre id="result"></pre>

    <script>
        async function submitData() {
            let input = document.getElementById("input").value;
            let arr = input.split(",");

            let response = await fetch("http://localhost:3000/bfhl", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    data: arr
                })
            });

            let data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data, null, 2);
        }
    </script>

</body>
</html>
